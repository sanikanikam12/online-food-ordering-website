<html>
<head>
    

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #fff5e6;
        }

        header {
            background-color: orange;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        .food {
            background-color: white;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            border: 1px solid gray;
        }
    </style>
</head>

<body>

<header>

    

   <h1><p>Online Food Ordering Website</p></h1>

    <nav>
        <a href="#"
onclick="showSection('home')">Home</a>
        <a href="#"
onclick="showSection('menu')">Menu</a>
       <a href="#"
onclick="showSection('order')">Order</a>
       <a href="#"
onclick="showSection('contact')">Contact</a>

    </nav>

</header>


<section id="home">

    <h2>Welcome</h2>

    <p>Order your favourite food easily.</p>

</section>


<section id="menu">

    <h2>Food Menu</h2>

    <div class="food">
        <h3>Pizza</h3>
        <p>₹150</p>
    </div>

    <div class="food">
        <h3>Burger</h3>
        <p>₹100</p>
    </div>

    <div class="food">
        <h3>Sandwich</h3>
        <p>₹80</p>
    </div>

    <div class="food">
        <h3>French Fries</h3>
        <p>₹70</p>
    </div>

</section>


<section id="order">

    <h2>Order Now</h2>

    <form>

        Food Name:
        <input type="text">

        <br><br>

        Quantity:
        <input type="number">

        <br><br>

        <input type="submit" value="Place Order">

    </form>

</section>


<section id="contact">

    <h2>Contact Us</h2>

    <p>Mobile: 9876543210</p>

    <p>Email: food@example.com</p>

</section>
<script>
function showSection(section) {

    document.getElementById("home").style.display = "none";
    document.getElementById("menu").style.display = "none";
    document.getElementById("order").style.display = "none";
    document.getElementById("contact").style.display = "none";

    document.getElementById(section).style.display = "block";
}



</script>

</body>
</html>
